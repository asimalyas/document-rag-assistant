[project]
name = "yt-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MUHAMMAD ASIM ALYAS", email = "135734492+asimalyas@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=0.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.45.0",
]

[project.scripts]
yt-rag = "yt_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
